  <script>
    document.addEventListener('DOMContentLoaded', () => {
  // Create the date element
  const dateElement = document.createElement('div');
  dateElement.classList.add('date-stamp');
  
  // Append it to the polaroid frame
  const polaroid = document.querySelector('.polaroid-frame');
  if (polaroid) {
    polaroid.appendChild(dateElement);
  }

  // Fetch and format the current date (e.g., "Sep 22, 2026")
  const today = new Date();
  const options = { year: 'numeric', month: 'short', day: 'numeric' };
  const dateString = today.toLocaleDateString('en-US', options); 

  let charIndex = 0;

  // Function to type out the date slowly
  function typeWriter() {
    if (charIndex < dateString.length) {
      dateElement.innerHTML += dateString.charAt(charIndex);
      charIndex++;
      setTimeout(typeWriter, 150); // Adjust speed: 150ms per letter
    }
  }

  // Starts the animation 500ms after the page loads
  setTimeout(typeWriter, 500);
});
  </script>
